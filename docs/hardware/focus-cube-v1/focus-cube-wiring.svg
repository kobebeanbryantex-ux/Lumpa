<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#386c87"/></marker><style>.title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#17354d}.h{font:700 23px 'Microsoft YaHei',sans-serif;fill:#17354d}.t{font:18px 'Microsoft YaHei',sans-serif;fill:#233b4a}.small{font:15px 'Microsoft YaHei',sans-serif;fill:#566f80}.box{fill:white;stroke:#376b86;stroke-width:3}.wire{stroke:#386c87;stroke-width:3;fill:none;marker-end:url(#a)}.pwr{stroke:#d34f45}.spi{stroke:#3086a6}.i2c{stroke:#4b9b67}.i2s{stroke:#9464ad}</style></defs>
  <rect width="1700" height="1100" fill="#f7f9fb"/>
  <text x="55" y="60" class="title">LUMPA Focus Cube V1 · 原型接线与数据链路</text>
  <text x="55" y="96" class="small">信号名优先于裸 GPIO 编号，减少换板时出错；最终 PCB 前必须按所购 Feather 修订版复核 pinout。</text>

  <rect x="610" y="330" width="420" height="360" rx="20" class="box" fill="#eef7f1"/>
  <text x="820" y="380" text-anchor="middle" class="h">ESP32-S3 Feather</text>
  <text x="820" y="415" text-anchor="middle" class="t">4 MB Flash / 2 MB PSRAM</text>
  <text x="650" y="470" class="t">SPI：SCK / MOSI</text><text x="650" y="505" class="t">LCD 控制：A0 CS / A1 DC</text>
  <text x="650" y="540" class="t">A2 RST / A3 BL MOSFET</text><text x="650" y="575" class="t">I²C：SDA / SCL</text>
  <text x="650" y="610" class="t">I²S：D5 BCLK / D6 LRCLK</text><text x="650" y="645" class="t">D9 DATA / D10 AMP-SD</text>

  <rect x="70" y="180" width="365" height="230" rx="18" class="box"/>
  <text x="252" y="225" text-anchor="middle" class="h">2.4" TFT / ILI9341</text>
  <text x="105" y="270" class="t">VCC 3V3　GND</text><text x="105" y="305" class="t">DIN→MOSI　CLK→SCK</text>
  <text x="105" y="340" class="t">CS→A0　DC→A1　RST→A2</text><text x="105" y="375" class="t">BL→N-MOSFET→A3 PWM</text>
  <path d="M435 300H550Q585 300 610 385" class="wire spi"/>

  <rect x="70" y="510" width="365" height="190" rx="18" class="box"/>
  <text x="252" y="555" text-anchor="middle" class="h">LSM6DSOX 6 轴 IMU</text>
  <text x="105" y="600" class="t">STEMMA QT：3V3 / GND / SDA / SCL</text>
  <text x="105" y="640" class="t">INT1→D11（可选，用于唤醒）</text><text x="105" y="675" class="small">I²C 地址 0x6A/0x6B；避开电池监测器 0x0B</text>
  <path d="M435 605H610" class="wire i2c"/>

  <rect x="1210" y="170" width="400" height="245" rx="18" class="box"/>
  <text x="1410" y="215" text-anchor="middle" class="h">音频链路</text>
  <text x="1245" y="260" class="t">MAX98357A：VIN→BAT、GND</text><text x="1245" y="297" class="t">BCLK→D5　LRC→D6　DIN→D9</text>
  <text x="1245" y="334" class="t">SD/MODE→D10；OUT±→8 Ω 扬声器</text>
  <text x="1245" y="370" class="small">BTL 输出：OUT− 不能接系统地</text>
  <text x="1245" y="393" class="small">0.5 W 扬声器必须由固件限制增益</text>
  <path d="M1210 325H1100Q1065 325 1030 420" class="wire i2s"/>

  <rect x="1210" y="520" width="400" height="205" rx="18" class="box"/>
  <text x="1410" y="565" text-anchor="middle" class="h">电源与充电</text>
  <text x="1245" y="608" class="t">受保护 3.7 V / 2000 mAh → JST-PH</text><text x="1245" y="645" class="t">USB-C 5 V → Feather 内置充电</text>
  <text x="1245" y="682" class="t">滑动开关：EN→GND（关机仍可充电）</text>
  <path d="M1210 625H1030" class="wire pwr"/>

  <rect x="610" y="800" width="420" height="195" rx="18" class="box"/>
  <text x="820" y="840" text-anchor="middle" class="h">BLE GATT（软件插入点）</text>
  <text x="650" y="878" class="t">Cube → App：orientation / selectedMinutes / button</text>
  <text x="650" y="912" class="t">App → Cube：remainingSec / petFrame / soundCue</text>
  <text x="650" y="948" class="small">应用是计时权威源；断连时本地计时</text>
  <text x="650" y="973" class="small">重连后以 App 的 sessionId / remainingSec 校准</text>
  <path d="M820 690V800" class="wire"/>

  <rect x="70" y="820" width="390" height="170" rx="18" class="box" fill="#eef5ff"/>
  <text x="265" y="865" text-anchor="middle" class="h">顶部面检测</text>
  <text x="105" y="905" class="t">+Y=25　+X=30　−Y=60　−X=15</text>
  <text x="105" y="940" class="t">阈值 |axis| ≥ 0.75 g，稳定 500 ms</text>
  <text x="105" y="973" class="small">变化一次只发一个事件；±Z 朝上不启动计时</text>
  <path d="M435 700Q515 770 610 850" class="wire i2c"/>

  <rect x="1210" y="820" width="400" height="170" rx="18" class="box" fill="#fff4ee"/>
  <text x="1410" y="865" text-anchor="middle" class="h">首次通电检查</text>
  <text x="1245" y="905" class="t">① 限流电源 5 V / 0.5 A 启动</text><text x="1245" y="940" class="t">② 确认无发热、无反接、充电电流正常</text>
  <text x="1245" y="973" class="t">③ 再接电池和扬声器，逐级提高音量</text>
  <text x="55" y="1060" class="small">注意：上图是原型连接定义。量产时必须加入 ESD、USB-C CC 电阻、反接/过流保护、EMC 和电池温升验证，并重新分配 GPIO。</text>
</svg>
