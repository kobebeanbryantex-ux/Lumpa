<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1d4d73"/></marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#17354d}.sub{font:18px 'Microsoft YaHei',sans-serif;fill:#49677c}
      .h{font:700 24px 'Microsoft YaHei',sans-serif;fill:#17354d}.t{font:18px 'Microsoft YaHei',sans-serif;fill:#203746}
      .small{font:15px 'Microsoft YaHei',sans-serif;fill:#466276}.dim{font:16px 'Microsoft YaHei',sans-serif;fill:#1d4d73}
      .line{stroke:#1d4d73;stroke-width:2;fill:none}.dash{stroke:#829bad;stroke-width:2;stroke-dasharray:8 7;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f6f8fa"/>
  <text x="60" y="60" class="title">LUMPA Focus Cube V1 · 机械布局基准图</text>
  <text x="60" y="94" class="sub">单位：mm　外壳目标尺寸：82 × 82 × 82　此图用于布局和打样，不替代最终 CAD 公差图</text>

  <text x="80" y="145" class="h">A. 正视图（显示面）</text>
  <rect x="80" y="175" width="492" height="492" rx="60" fill="#f5ead7" stroke="#17354d" stroke-width="3"/>
  <rect x="106" y="201" width="440" height="440" rx="48" fill="#ef7d6f" opacity=".72"/>
  <rect x="116" y="211" width="420" height="420" rx="43" fill="#171c21"/>
  <rect x="150" y="291" width="352" height="260" rx="8" fill="#172936" stroke="#88d4ef" stroke-width="3"/>
  <rect x="179" y="311" width="294" height="220" rx="3" fill="#091219"/>
  <g fill="#fff3e8">
    <rect x="286" y="345" width="80" height="70"/><rect x="271" y="335" width="25" height="35"/><rect x="356" y="335" width="25" height="35"/>
    <rect x="296" y="405" width="65" height="75"/><rect x="270" y="462" width="30" height="18"/><rect x="360" y="462" width="30" height="18"/>
  </g>
  <g fill="#ff9d7d"><rect x="276" y="341" width="14" height="23"/><rect x="361" y="341" width="14" height="23"/></g>
  <g fill="#182029"><rect x="307" y="376" width="10" height="12"/><rect x="346" y="376" width="10" height="12"/><rect x="326" y="393" width="12" height="7"/></g>
  <text x="326" y="580" text-anchor="middle" class="small" fill="#d3e9f5">2.4" TFT active area 48.96 × 36.72</text>
  <line x1="80" y1="705" x2="572" y2="705" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="80" y1="676" x2="80" y2="720" class="line"/><line x1="572" y1="676" x2="572" y2="720" class="line"/>
  <text x="326" y="735" text-anchor="middle" class="dim">82.0</text>
  <line x1="615" y1="175" x2="615" y2="667" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="580" y1="175" x2="630" y2="175" class="line"/><line x1="580" y1="667" x2="630" y2="667" class="line"/>
  <text x="642" y="428" class="dim" transform="rotate(90 642 428)">82.0</text>
  <text x="80" y="780" class="t">前窗建议：64 × 64 × 1.5 黑色烟熏亚克力；显示模块实际 PCB 为 70.5 × 43.3。</text>
  <text x="80" y="812" class="small">显示屏不是 64 mm 方屏；方形黑窗只是遮罩，真实可视区域为 48.96 × 36.72。</text>

  <text x="760" y="145" class="h">B. 中央剖面（前 → 后）</text>
  <rect x="760" y="175" width="492" height="492" rx="60" fill="#fff" stroke="#17354d" stroke-width="3"/>
  <line x1="1006" y1="175" x2="1006" y2="667" class="dash"/>
  <text x="1006" y="695" text-anchor="middle" class="small">几何中心 / IMU 基准面</text>
  <rect x="775" y="225" width="10" height="392" rx="4" fill="#20262c"/><text x="775" y="205" class="small">1.5 镜片</text>
  <rect x="790" y="240" width="28" height="362" fill="#52a7c2" opacity=".78"/><text x="792" y="630" class="small">显示模组 ≤ 6</text>
  <rect x="830" y="205" width="18" height="432" fill="#eadcc8" stroke="#9a7a5d"/><text x="850" y="220" class="small">3.0 前载板</text>
  <rect x="965" y="365" width="82" height="112" fill="#74b786" stroke="#2e6d43"/><text x="1006" y="352" text-anchor="middle" class="small">IMU 居中、刚性固定</text>
  <rect x="875" y="250" width="270" height="74" rx="8" fill="#58a66d" stroke="#2e6d43"/><text x="1010" y="294" text-anchor="middle" class="t">ESP32-S3 Feather 52.3 × 22.7 × 7.2</text>
  <rect x="875" y="500" width="300" height="84" rx="8" fill="#c9ced3" stroke="#6c7881"/><text x="1025" y="550" text-anchor="middle" class="t">Li-ion 2000 mAh · 60 × 36 × 7</text>
  <rect x="1135" y="340" width="32" height="70" rx="4" fill="#528a61"/><text x="1175" y="375" class="small">功放</text>
  <circle cx="1192" cy="452" r="38" fill="#30363b" stroke="#111" stroke-width="3"/><circle cx="1192" cy="452" r="19" fill="#171b1e"/>
  <text x="1095" y="520" class="small">Ø28 × 4.5 扬声器</text>
  <rect x="1223" y="205" width="14" height="432" fill="#eadcc8" stroke="#9a7a5d"/><text x="1175" y="220" class="small">后盖 2.4</text>
  <rect x="1223" y="270" width="20" height="18" rx="8" fill="#171c21"/><text x="1150" y="260" class="small">USB-C 开口</text>
  <line x1="760" y1="705" x2="1252" y2="705" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="760" y1="676" x2="760" y2="720" class="line"/><line x1="1252" y1="676" x2="1252" y2="720" class="line"/>
  <text x="1006" y="735" text-anchor="middle" class="dim">82.0</text>
  <text x="760" y="780" class="t">布局原则：电池与主控并排，不叠压；天线前方 ≥10 mm 禁止金属/电池。</text>
  <text x="760" y="812" class="t">不使用“固定配重块”：翻转后它不会始终位于下方，反而破坏质量平衡。</text>

  <rect x="80" y="860" width="1172" height="92" rx="12" fill="#eaf1f5" stroke="#b4c7d3"/>
  <text x="105" y="894" class="t">四个计时面围绕前后轴排列：上 25 / 右 30 / 下 60 / 左 15 分钟；前面始终朝用户，屏幕内容由 IMU 反向旋转保持竖直。</text>
  <text x="105" y="928" class="small">待 CAD/样机确认：圆角 R10、卡扣厚度、螺柱位置、显示排线弯曲半径、USB-C 插拔净空、声腔体积和外壳跌落强度。</text>
  <rect x="1310" y="175" width="230" height="492" rx="20" fill="#fff" stroke="#c7d4dc"/>
  <text x="1335" y="215" class="h">外壳建议</text>
  <text x="1335" y="260" class="t">外尺寸 82³</text><text x="1335" y="294" class="t">壁厚 2.4</text><text x="1335" y="328" class="t">圆角 R10</text>
  <text x="1335" y="385" class="t">FDM 间隙</text><text x="1335" y="417" class="small">每侧 0.25–0.35</text>
  <text x="1335" y="465" class="t">树脂间隙</text><text x="1335" y="497" class="small">每侧 0.15–0.25</text>
  <text x="1335" y="545" class="t">紧固</text><text x="1335" y="577" class="small">4 × M2 热熔铜柱</text>
  <text x="1335" y="609" class="small">后盖可拆，前框卡扣</text>
</svg>
