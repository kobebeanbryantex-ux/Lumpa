<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs><style>.title{font:700 34px 'Microsoft YaHei',sans-serif;fill:#17354d}.sub{font:18px 'Microsoft YaHei',sans-serif;fill:#557083}.n{font:700 24px sans-serif;fill:white}.lab{font:19px 'Microsoft YaHei',sans-serif;fill:#203746}.small{font:15px 'Microsoft YaHei',sans-serif;fill:#577184}.lead{stroke:#47758f;stroke-width:2;fill:none}</style></defs>
  <rect width="1800" height="1050" fill="#f7f9fb"/>
  <text x="55" y="58" class="title">LUMPA Focus Cube V1 · 可制造爆炸顺序图</text>
  <text x="55" y="93" class="sub">编号对应右侧 BOM；几何关系是装配依据，外观概念渲染不是加工依据</text>
  <line x1="80" y1="505" x2="1280" y2="505" stroke="#bdd0dc" stroke-width="2" stroke-dasharray="9 8"/>

  <g transform="translate(90 265)"><rect width="52" height="480" rx="22" fill="#1a2025"/><circle cx="26" cy="-25" r="18" fill="#24749b"/><text x="26" y="-17" text-anchor="middle" class="n">1</text></g>
  <g transform="translate(175 245)"><rect width="72" height="520" rx="28" fill="#f1e5d4" stroke="#987d65" stroke-width="3"/><rect x="13" y="55" width="46" height="410" rx="16" fill="none" stroke="#ef7d6f" stroke-width="8"/><circle cx="36" cy="-25" r="18" fill="#24749b"/><text x="36" y="-17" text-anchor="middle" class="n">2</text></g>
  <g transform="translate(290 345)"><rect width="70" height="320" rx="5" fill="#3d8f5b"/><rect x="8" y="20" width="54" height="280" fill="#101820"/><circle cx="35" cy="-25" r="18" fill="#24749b"/><text x="35" y="-17" text-anchor="middle" class="n">3</text></g>
  <g transform="translate(405 255)"><rect width="42" height="500" rx="8" fill="#eadcc8" stroke="#987d65" stroke-width="3"/><rect x="8" y="45" width="26" height="410" fill="#f7f9fb"/><circle cx="21" cy="-25" r="18" fill="#24749b"/><text x="21" y="-17" text-anchor="middle" class="n">4</text></g>
  <g transform="translate(500 445)"><rect width="65" height="85" rx="6" fill="#4b9a61"/><rect x="14" y="22" width="37" height="38" fill="#252c30"/><circle cx="32" cy="-55" r="18" fill="#24749b"/><text x="32" y="-47" text-anchor="middle" class="n">5</text></g>
  <g transform="translate(610 408)"><rect width="230" height="95" rx="7" fill="#3d8f5b"/><rect x="75" y="18" width="88" height="60" rx="5" fill="#bdc5ca"/><rect x="218" y="31" width="22" height="34" rx="7" fill="#909ba3"/><circle cx="115" cy="-35" r="18" fill="#24749b"/><text x="115" y="-27" text-anchor="middle" class="n">6</text></g>
  <g transform="translate(660 560)"><rect width="220" height="135" rx="11" fill="#c9ced3" stroke="#7c878e" stroke-width="3"/><rect x="0" y="0" width="220" height="14" fill="#e3b900"/><circle cx="110" cy="170" r="18" fill="#24749b"/><text x="110" y="178" text-anchor="middle" class="n">7</text></g>
  <g transform="translate(930 420)"><rect width="70" height="82" rx="5" fill="#4b9a61"/><rect x="20" y="24" width="30" height="34" fill="#252c30"/><circle cx="35" cy="-35" r="18" fill="#24749b"/><text x="35" y="-27" text-anchor="middle" class="n">8</text></g>
  <g transform="translate(1045 405)"><circle cx="50" cy="50" r="50" fill="#30363b"/><circle cx="50" cy="50" r="28" fill="#15191c"/><circle cx="50" cy="-30" r="18" fill="#24749b"/><text x="50" y="-22" text-anchor="middle" class="n">9</text></g>
  <g transform="translate(1190 250)"><rect width="70" height="510" rx="26" fill="#f1e5d4" stroke="#987d65" stroke-width="3"/><rect x="0" y="215" width="24" height="42" rx="9" fill="#171c21"/><path d="M18 320h34m-34 18h34m-34 18h34" stroke="#8d7766" stroke-width="5"/><circle cx="35" cy="-25" r="18" fill="#24749b"/><text x="35" y="-17" text-anchor="middle" class="n">10</text></g>
  <g transform="translate(1305 345)"><path d="M0 0h55v12H0zm0 85h55v12H0zm0 85h55v12H0zm0 85h55v12H0z" fill="#7e8b93"/><circle cx="27" cy="-35" r="18" fill="#24749b"/><text x="27" y="-27" text-anchor="middle" class="n">11</text></g>

  <rect x="1390" y="140" width="365" height="820" rx="18" fill="#fff" stroke="#cad7df" stroke-width="2"/>
  <text x="1420" y="185" class="title" font-size="28">编号 / 关键数据</text>
  <g class="lab">
    <text x="1420" y="235">1　黑色亚克力镜片</text><text x="1455" y="262" class="small">64 × 64 × 1.5；背面黑色遮罩</text>
    <text x="1420" y="310">2　前框 + 0.5 mm 泡棉圈</text><text x="1455" y="337" class="small">卡扣固定；不得压 LCD 玻璃</text>
    <text x="1420" y="385">3　2.4" TFT / ILI9341</text><text x="1455" y="412" class="small">PCB 70.5 × 43.3；SPI</text>
    <text x="1420" y="460">4　内部承载架</text><text x="1455" y="487" class="small">74 × 74 × 3；PC-ABS / PETG</text>
    <text x="1420" y="535">5　LSM6DSOX IMU</text><text x="1455" y="562" class="small">25.6 × 17.8 × 4.6；几何中心</text>
    <text x="1420" y="610">6　ESP32-S3 Feather</text><text x="1455" y="637" class="small">52.3 × 22.7 × 7.2；BLE + USB-C</text>
    <text x="1420" y="685">7　受保护 2000 mAh 电池</text><text x="1455" y="712" class="small">60 × 36 × 7；独立软垫仓</text>
    <text x="1420" y="760">8　MAX98357A I²S 功放</text><text x="1455" y="787" class="small">19.4 × 17.8 × 3.0</text>
    <text x="1420" y="835">9　扬声器</text><text x="1455" y="862" class="small">Ø28 × 4.5；8 Ω / 0.5 W</text>
    <text x="1420" y="910">10 后维修盖　　11 M2 紧固件</text><text x="1455" y="937" class="small">USB-C + 声孔；4 × M2×8 + 铜柱</text>
  </g>
  <text x="70" y="930" class="lab">推荐装配方向：1 → 4 构成前显示组件；5 固定在 4 的中心；6/7 并排进入主腔；8/9 固定到后盖；10 最后用 11 锁紧。</text>
  <text x="70" y="970" class="small">禁止事项：电池上打螺丝、挤压电池、IMU 用厚软胶悬空、天线贴近电池或金属、功放输出任一端接地。</text>
</svg>
