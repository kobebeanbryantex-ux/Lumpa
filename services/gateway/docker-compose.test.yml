services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lumpa_test
      POSTGRES_USER: lumpa
      POSTGRES_PASSWORD: lumpa-local-test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumpa -d lumpa_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis-test:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", ""]
    ports: ["127.0.0.1:56379:6379"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
